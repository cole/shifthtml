[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shifthtml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "ty>=0.0.1a7",
    "ruff",
    "pytest>=8.3.5",
    "pytest-asyncio>=1.0.0",
]

[tool.ty.src]
include = ["src/", "tests/"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
