<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Todo List</title><script src="https://unpkg.com/htmx.org@1.9.10"></script><link rel="stylesheet" href="/static/style.css" /></head><body><h1>Todo List</h1><form class="add-todo" hx-post="/todos" hx-target="#todo-list" hx-swap="innerHTML"><input type="text" name="title" placeholder="Add a new todo..." required autocomplete="off" /><button type="submit">Add</button></form><div id="todo-list" class="todo-list"><div id="todo-1" class="todo-item"><input type="checkbox" hx-put="/todos/1/toggle" hx-target="#todo-1" hx-swap="outerHTML" autocomplete="off" /><span class="todo-label">Buy milk</span><button hx-delete="/todos/1" hx-target="#todo-1" hx-swap="outerHTML">Delete</button></div><div id="todo-2" class="todo-item"><input type="checkbox" hx-put="/todos/2/toggle" hx-target="#todo-2" hx-swap="outerHTML" autocomplete="off" checked="checked" /><span class="todo-label completed">Walk dog</span><button hx-delete="/todos/2" hx-target="#todo-2" hx-swap="outerHTML">Delete</button></div></div></body></html>
