<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>ShiftHTML Chat</title><script type="module" src="https://cdn.jsdelivr.net/gh/starfederation/datastar@v1.0.0-RC.7/bundles/datastar.js"></script><link rel="stylesheet" href="/static/style.css" /></head><body data-signals="{&quot;username&quot;: &quot;newuser&quot;, &quot;messageInput&quot;: &quot;&quot;}"><div data-init="@get(&#x27;/feed&#x27;)" class="chat-container"><div class="chat-header"><h1>ShiftHTML Chat</h1><span class="username">Chatting as newuser</span></div><div id="messages" class="messages"><div class="empty-state">No messages yet. Say hello!</div></div><form data-on:submit__case.kebab__prevent="@post(&#x27;/send&#x27;); $messageInput=&#x27;&#x27;" class="chat-input"><input data-bind="messageInput" type="text" placeholder="Type a message..." class="message-input" /><button type="submit" class="send-button">Send</button></form><div class="server-status"><span>Server time: 12:00:00</span></div></div></body></html>
