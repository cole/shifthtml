<div id="todo-{{ todo.id }}" style="padding: 16px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 12px;">
    <input
        type="checkbox"
        {% if todo.completed %}checked{% endif %}
        hx-put="/todos/{{ todo.id }}/toggle"
        hx-target="#todo-{{ todo.id }}"
        hx-swap="outerHTML"
        style="width: 20px; height: 20px; cursor: pointer;">
    <span style="flex: 1; {% if todo.completed %}text-decoration: line-through; color: #999;{% endif %}">
        {{ todo.title }}
    </span>
    <button
        hx-delete="/todos/{{ todo.id }}"
        hx-target="#todo-{{ todo.id }}"
        hx-swap="outerHTML"
        style="padding: 6px 12px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer;">
        Delete
    </button>
</div>
