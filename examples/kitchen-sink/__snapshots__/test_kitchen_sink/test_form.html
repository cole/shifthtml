<section><form><p><label for="example-input-email">Email address</label><input type="email" id="example-input-email" placeholder="Enter email" /></p><p><label for="example-input-number">Number</label><input type="number" id="example-input-number" placeholder="Number" /></p><p><label for="example-input-password">Password</label><input type="password" id="example-input-password" placeholder="Password" /></p><p><label for="example-input-search">Search</label><input type="search" id="example-input-search" placeholder="Search .." /></p><p><label for="example-input-tel">Telephone number</label><input type="tel" id="example-input-tel" placeholder="Telephone number" /></p><p><label for="example-input-text">Text</label><input type="text" id="example-input-text" placeholder="Enter some text here" /></p><p><label for="example-input-url">Url</label><input type="url" id="example-input-url" placeholder="Enter a url here" /></p><p><label for="example-input-color">Color</label><input type="color" id="example-input-color" placeholder="#fff" /></p><p><label for="example-input-date">Date</label><input type="date" id="example-input-date" placeholder="date" /></p><p><label for="example-input-datetime-local">Date / Time local</label><input type="datetime-local" id="example-input-datetime-local" placeholder="date / time local" /></p><p><label for="example-input-month">Month</label><input type="month" id="example-input-month" placeholder="Month" /></p><p><label for="example-input-week">Week</label><input type="week" id="example-input-week" placeholder="Week" /></p><p><label for="example-input-time">Time</label><input type="time" id="example-input-time" placeholder="Time" /></p><p><label for="example-input-range">Range</label><input type="range" id="example-input-range" min="0" max="100" value="50" /></p><p><label for="example-select">Example select</label><select id="example-select"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></p><p><label for="example-select-multi">Example multiple select</label><select id="example-select-multi" multiple><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></p><p><label for="example-textarea">Example textarea</label><textarea id="example-textarea" rows="3"></textarea></p><p><label for="example-input-file">File input</label><input type="file" id="example-input-file" /></p><fieldset><legend>I am legend</legend><div><label><input type="radio" name="options-radios" id="options-radios-1" value="option1" checked /> Option one is this and that—be sure to include why it's great</label></div><div><label><input type="radio" name="options-radios" id="options-radios-2" value="option2" /> Option two can be something else and selecting it will deselect option one</label></div><div><label><input type="radio" name="options-radios" id="options-radios-3" value="option3" disabled /> Option three is disabled</label></div></fieldset><fieldset><legend>I am also legend</legend><label><input type="checkbox" /> Check me out</label><label><input type="checkbox" /> Or check me out</label></fieldset><p><button type="button">Button</button><input type="button" value="Input Button" /><input type="submit" value="Submit Button" /><input type="reset" value="Reset Button" /></p></form></section>
